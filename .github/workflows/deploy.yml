name: Deploy Sitio Web a GitHub Pages

on:
  push:
    branches: [ "main" ]

  # Permite ejecutar manualmente el despliegue desde la interfaz de GitHub
  workflow_dispatch:

# Permisos requeridos para que el workflow pueda publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garantiza que solo haya un despliegue a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar archivos del sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
